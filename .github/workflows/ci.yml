name: Test and package CocoVS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python -m pip install cdm-devkit==0.2.3
      - run: npm test
        env:
          COCOVS_INTEGRATION: '1'
          COCOVS_SKIP_CDMBOT: '1'
          COCOVS_PYTHON: python
      - run: npm install --no-save --package-lock=false @vscode/test-electron@2.5.2
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - if: runner.os != 'Linux'
        run: npm run test:host
      - if: runner.os == 'Linux'
        run: npm run package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cocovs-vsix
          path: '*.vsix'
          if-no-files-found: error
