name: Test and package CocoVS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install and configure the bundled cdmbot toolchain
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(Path('package.json').read_text(encoding='utf-8'))
          wheel = next(file for file in manifest['files'] if file.startswith('runtime/cdmbot-') and file.endswith('.whl'))
          for file in [wheel, 'runtime/cocas_templates.py']:
              if not Path(file).is_file():
                  raise SystemExit(f'Missing bundled runtime file: {file}. Commit it before running CI.')
              subprocess.check_call(['git', 'ls-files', '--error-unmatch', '--', file], stdout=subprocess.DEVNULL)
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel])

          import cdmbot
          registry = Path(cdmbot.__file__).parent / 'data' / 'registry'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'COCOVS_PYTHON={sys.executable}\n')
              output.write(f'COCOVS_CDMBOT_DEVELOPMENT_PYTHON={sys.executable}\n')
              output.write(f'CDMBOT_REGISTRY={registry}\n')
          PY
      - run: npm test
        env:
          COCOVS_INTEGRATION: '1'
      - run: npm install --no-save --package-lock=false @vscode/test-electron@2.5.2
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - if: runner.os != 'Linux'
        run: npm run test:host
      - if: runner.os == 'Linux'
        run: npm run package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cocovs-vsix
          path: '*.vsix'
          if-no-files-found: error
